# Official bundle layer. `dsh plugin add dsh-plugin-free-model-advisor` applies this row
# into the profile. Rows resolve by package name so the installed copy is what boots.
# Only the two free opencode-go models are listed — no paid models, ever.
- insert:
    - id: dsh-plugin-free-model-advisor
      name: dsh-plugin-free-model-advisor
      config:
        models:
          - id: hy4-flash-free
            provider: opencode-go
            contextWindow: 1048576
            free: true
          - id: longcat-2.5-free
            provider: opencode-go
            contextWindow: 1000000
            free: true
